name = "rocketcamel/elementium"
version = "0.1.0"
includes = ["src/**", "pesde.toml"]

[target]
environment = "roblox"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
jecs = { repo = "ukendio/jecs", rev = "v0.11.0" }
jabby = { repo = "alicesaidhi/jabby", rev = "436e482" }
scheduler = { workspace = "rocketcamel/elementium_scheduler" }
conch = { wally = "alicesaidhi/conch", version = "0.4.0" }
conch_ui = { wally = "alicesaidhi/conch-ui", version = "0.4.0" }
cmdr = { wally = "evaera/cmdr", version = "1.13.1" }
util = { workspace = "rocketcamel/elementium_util" }
elementium_ui = { workspace = "rocketcamel/elementium_ui" }
profile_store = { wally = "lm-loleris/profilestore", version = "1.0.3" }
