name = "rocketcamel/elementium_ui"
version = "0.1.0"
includes = ["src/**", "pesde.toml"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
fluid = { wally = "ffrostfall/fluid", version = "=0.6.4" }
